<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>深蓝海之波 (Deep Ocean Bloom) - Art Archive Oracle</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/addons/p5.sound.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Noto Serif SC', serif;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            max-width: 600px;
            color: white;
            pointer-events: none;
            z-index: 100;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 1rem 0;
            font-weight: 200;
            letter-spacing: 0.05em;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            opacity: 0.9;
            margin: 0;
            padding-left: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.5);
        }

        .meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .gradient-drop {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 90;
        }
    </style>
</head>

<body>
    <div class="gradient-drop"></div>
    <div id="overlay">
        <div class="meta">WCC WAVE CHALLENGE</div>
        <h1>深蓝海之波 (Deep Ocean Bloom)</h1>
        <p>
            这个作品利用 p5.js 的着色器修改功能，在 WEBGL 模式下构建了一个动态的波浪平面。通过在着色器逻辑中注入分形噪声，模拟海面的实时起伏，并利用 Framebuffer
            实现高光阈值的模糊（Bloom）处理，创造出梦幻的泛光与倒影。这是一个关于流动、光影与数学韵律的数字沉思。
        </p>
    </div>
    <script>
        let waves
        let env

        let base
        let bloom

        let rotX = -0.3;
        let rotY = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL)

            base = createFramebuffer({ antialias: false, depth: false })
            bloom = createFramebuffer({ antialias: false, depth: false })

            // Create the background gradient
            envBuf = createFramebuffer({ width: 400, height: 200 })
            envBuf.draw(() => {
                noStroke()
                beginShape(QUAD_STRIP)
                fill('#65B6FC')
                vertex(-envBuf.width / 2, -envBuf.height / 2)
                vertex(envBuf.width / 2, -envBuf.height / 2)
                fill('#CCE7FF')
                vertex(-envBuf.width / 2, 1)
                vertex(envBuf.width / 2, 1)
                vertex(-envBuf.width / 2, envBuf.height / 2)
                vertex(envBuf.width / 2, envBuf.height / 2)
                endShape()
            })
            env = envBuf.get()
            envBuf.remove()

            waves = baseMaterialShader().modify(() => {
                // Try adjusting this lower or higher to see how the reflections change!
                const bumpHeightScale = 40

                // A noise implementation. We're going to include something like this
                // in p5 in a future version.
                function mod289(x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                function perm(x) { return mod289(((x * 34.0) + 1.0) * x); }
                function noise3(p) {
                    let a = floor(p);
                    let d = p - a;
                    d = d * d * (3.0 - 2.0 * d);

                    let b = [a.x, a.x, a.y, a.y] + vec4(0.0, 1.0, 0.0, 1.0);
                    let k1 = perm([b.x, b.y, b.x, b.y]);
                    let k2 = perm([k1.x, k1.y, k1.x, k1.y] + [b.z, b.z, b.w, b.w]);

                    let c = k2 + [a.z, a.z, a.z, a.z];
                    let k3 = perm(c);
                    let k4 = perm(c + 1.0);

                    let o1 = fract(k3 * (1.0 / 41.0));
                    let o2 = fract(k4 * (1.0 / 41.0));

                    let o3 = o2 * d.z + o1 * (1.0 - d.z);
                    let o4 = o3.yw * d.x + o3.xz * (1.0 - d.x);

                    return smoothstep(0, 1, o4.y * d.y + o4.x * (1.0 - d.y));
                }
                const fractalNoise3 = (v1, v2, t) => {
                    const s = 0.35
                    return noise3([v1, v2, t]) +
                        s * noise3([v1 * 2, v2 * 2, t * 2]) +
                        s * s * noise3([v1 * 4, v2 * 4, t * 4]) +
                        s * s * s * noise3([v1 * 8, v2 * 8, t * 8]) +
                        s * s * s * s * 0.5 * noise3([v1 * 16, v2 * 16, t * 16])
                }

                const t = uniformFloat(() => millis())
                getPixelInputs((inputs) => {
                    // Find the position at the current pixel and scale it a bit
                    // to make the noise look nice (also shifting it over time)
                    const pos = inputs.texCoord * 150 + t * 0.0001

                    // Function to get the height of the waves at the current position + time
                    const bumpHeight = (x, y) => bumpHeightScale * fractalNoise3(x, y, t * 0.001)

                    // Sample the height at the current position, and also a little down
                    // and a little to the right. This gives us info to approximate the gradient
                    // of the noise, and calculate a new normal.
                    const h = bumpHeight(pos.x, pos.y)
                    const hR = bumpHeight(pos.x + 0.01, pos.y)
                    const hD = bumpHeight(pos.x, pos.y + 0.01)
                    const norm = normalize(cross([1, hR - h, 0], [0, hD - h, 1]))

                    // The normal doesn't yet take into account the orientation of
                    // the scene. This maps it onto the orientation of the "real"
                    // normal.
                    const origNorm = inputs.normal
                    const w = [1, 0, 0]
                    const v = normalize(cross(w, origNorm))
                    const u = normalize(cross(v, origNorm))
                    let newNormal =
                        u * norm.x +
                        v * norm.z +
                        origNorm * -norm.y

                    inputs.normal = newNormal
                    return inputs
                })
            })
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight)
        }

        function draw() {
            // Draw the waves
            base.begin()

            // Restricted camera control
            if (mouseIsPressed && mouseY > 0) {
                rotY += (mouseX - pmouseX) * 0.005;
                rotX += (mouseY - pmouseY) * 0.005;
            }
            rotX = constrain(rotX, -0.6, -0.05); // Limit vertical to stay above water
            rotateX(rotX);
            rotateY(rotY);

            panorama(env)

            // Adjusted lighting for visible waves
            directionalLight(100, 100, 100, 0, 1, 0.15)
            pointLight(255, 255, 255, 0, -height, -5000)
            ambientLight(150)

            push()
            emissiveMaterial(255)
            translate(0, -height, -5000)
            noStroke()
            sphere(150)
            pop()

            push()
            shader(waves)
            noStroke()
            fill('#4E668A')
            ambientMaterial('rgb(59,133,159)')
            specularMaterial(255)
            shininess(100)
            translate(0, width * 0.08)
            rotateX(PI / 2)
            plane(width * 16, width * 16)
            pop()
            base.end()

            imageMode(CENTER)

            // Threshold + blur to get the bloom effect
            bloom.begin()
            image(base, 0, 0)
            filter(THRESHOLD, 0.9)
            filter(BLUR, 5)
            bloom.end()

            // Add everything back together
            image(base, 0, 0)
            push()
            blendMode(ADD)
            image(bloom, 0, 0)
            pop()
        }
    </script>
</body>

</html>
