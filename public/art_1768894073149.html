<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;

    }

      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;

      font-size: 3rem;

      font-size: 1rem;

<body>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>Rational Kinetic Constructivism (理性动力建构主义)</h1>
    <p>
      这种艺术风格名为“理性动力建构主义”，是包豪斯经典美学在数字时代的演化。它保留了对基础几何形状（圆、矩形、等边三角形）的纯粹追求，并严守红、黄、蓝、黑、白的经典配色方案。不同于传统平面设计，该风格通过代码注入了“功能性律动”：每一个图形不再是孤立的装饰，而是网格系统中精密运行的模块。视觉上，它呈现出一种类似机械齿轮或建筑蓝图的动态秩序，反映了您内心对效率、清晰逻辑以及结构美的深刻认同。点击屏幕可以根据鼠标位置实时改变网格的振荡频率，体验理性控制下的动态平衡。
    </p>
  </div>
  <script>
    let spacing = 80; let colors; function setup() { createCanvas(windowWidth, windowHeight); colors = [color('#E63946'), color('#1D3557'), color('#FFB703'), color('#111111'), color('#F1FAEE')]; rectMode(CENTER); noStroke(); } function draw() { background(241, 250, 238); let cols = floor(width / spacing); let rows = floor(height / spacing); let offsetX = (width - (cols - 1) * spacing) / 2; let offsetY = (height - (rows - 1) * spacing) / 2; for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { let x = offsetX + i * spacing; let y = offsetY + j * spacing; let d = dist(mouseX, mouseY, x, y); let sizeFactor = map(sin(frameCount * 0.05 + d * 0.01), -1, 1, 0.5, 1.2); push(); translate(x, y); drawElement(i, j, sizeFactor); pop(); } } } function drawElement(i, j, s) { let type = (i * 7 + j * 3) % 4; let t = frameCount * 0.02; if (type === 0) { fill(colors[0]); rotate(t * (i % 2 === 0 ? 1 : -1)); arc(0, 0, spacing * 0.7 * s, spacing * 0.7 * s, 0, PI + QUARTER_PI); } else if (type === 1) { fill(colors[1]); rect(0, 0, spacing * 0.6 * s, spacing * 0.6 * s); fill(255, 50); rect(0, 0, spacing * 0.3 * s, spacing * 0.3 * s); } else if (type === 2) { fill(colors[2]); let h = (spacing * 0.6 * s) * (sqrt(3) / 2); triangle(-spacing * 0.3 * s, h / 2, spacing * 0.3 * s, h / 2, 0, -h / 2); } else { fill(colors[3]); ellipse(0, 0, spacing * 0.15 * s, spacing * 0.15 * s); stroke(colors[3]); strokeWeight(2); noFill(); line(-spacing * 0.4, 0, spacing * 0.4, 0); noStroke(); } } function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
