  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>多维动力立体主义 (Multi-Dimensional Kinetic Cubism)</h1>
    <p>这种风格将您的现实影像实时拆解为数十个独立的几何刻面，模仿了毕加索与布拉克早期的分析立体主义。通过调用摄像头，画面不再是单一的平面，而是由一系列在三维空间中缓慢旋转的矩形切片组成。每个切片捕捉了不同瞬间和角度的视觉碎片，利用多重透视和重叠的几何形状展示了世界的非线性本质。请点击屏幕以激活摄像头权限，感受这种将表象解构并重组成内在秩序的过程。</p>
  </div>
  <script>
    let capture; let tiles = 8; let tileW, tileH; function setup() { createCanvas(windowWidth, windowHeight, WEBGL); capture = createCapture(VIDEO); capture.size(640, 480); capture.hide(); tileW = width / tiles; tileH = height / tiles; noStroke(); } function draw() { background(20, 20, 25); ambientLight(150); directionalLight(255, 255, 255, 0, 0, -1); rotateY(sin(frameCount * 0.01) * 0.2); for (let x = 0; x < tiles; x++) { for (let y = 0; y < tiles; y++) { push(); let xOffset = x * tileW - width / 2 + tileW / 2; let yOffset = y * tileH - height / 2 + tileH / 2; let zOffset = sin(frameCount * 0.05 + x + y) * 100; translate(xOffset, yOffset, zOffset); let rotX = map(mouseX, 0, width, -0.5, 0.5) + sin(frameCount * 0.02 + x) * 0.3; let rotY = map(mouseY, 0, height, -0.5, 0.5) + cos(frameCount * 0.02 + y) * 0.3; rotateX(rotX); rotateY(rotY); texture(capture); let sx = map(x, 0, tiles, 0, capture.width); let sy = map(y, 0, tiles, 0, capture.height); let sw = capture.width / tiles; let sh = capture.height / tiles; beginShape(); textureMode(IMAGE); vertex(-tileW / 2, -tileH / 2, 0, sx, sy); vertex(tileW / 2, -tileH / 2, 0, sx + sw, sy); vertex(tileW / 2, tileH / 2, 0, sx + sw, sy + sh); vertex(-tileW / 2, tileH / 2, 0, sx, sy + sh); endShape(); pop(); } } } function windowResized() { resizeCanvas(windowWidth, windowHeight); tileW = width / tiles; tileH = height / tiles; } function mousePressed() { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { DeviceOrientationEvent.requestPermission(); } }
  </script>
