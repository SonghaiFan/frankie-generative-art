<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Monumental Tremorism (巨像颤栗主义) - Art Archive Oracle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div id="overlay">
    <div class="meta">美学签名</div>
    <h1>Monumental Tremorism (巨像颤栗主义)</h1>
    <p>‘巨像颤栗主义’是一种探讨绝对力量与个体感知之间张力的艺术风格。其核心视觉语言由宏大的、具有压迫感的几何单体（Monoliths）构成，代表着不可撼动的宇宙真理或自然伟力。画面通过高频的顶点位移（Vertex
      Shaking）和低频的呼吸律动，模拟在面对‘崇高’时灵魂不由自主的战栗感。色调采用深邃的暗调背景，点缀以极高亮度的光脉，通过HSB色彩模式下的微妙偏移，营造出一种超脱尘世的、神圣而又令人不安的无限空间感。点击屏幕可触发更剧烈的视觉震颤，象征个体与宏大叙事的深度共鸣。
    </p>
  </div>
  <script>
    let particles = []; let monolithHeight; let shakeAmt = 0; function setup() { createCanvas(windowWidth, windowHeight, WEBGL); colorMode(HSB, 360, 100, 100, 1); monolithHeight = height * 1.5; for (let i = 0; i < 500; i++) { particles.push({ x: random(-width, width), y: random(-height * 2, height * 2), z: random(-2000, 500), size: random(1, 4), speed: random(0.5, 2) }); } } function draw() { background(0); ambientLight(0, 0, 10); pointLight(200, 10, 100, 200, -500, 500); if (mouseIsPressed) { shakeAmt = lerp(shakeAmt, 15, 0.1); } else { shakeAmt = lerp(shakeAmt, 1, 0.05); } rotateY(frameCount * 0.002); rotateX(PI * 0.05); drawStars(); drawMonolith(); } function drawMonolith() { push(); let noiseVal = noise(frameCount * 0.05); let jitterX = (noise(frameCount * 0.2) - 0.5) * shakeAmt * 2; let jitterZ = (noise(frameCount * 0.2 + 100) - 0.5) * shakeAmt * 2; translate(jitterX, 0, jitterZ); stroke(200, 50, 100, 0.3); noFill(); for (let h = 0; h < 15; h++) { push(); let w = 200 + sin(frameCount * 0.02 + h) * 20; let d = 200 + cos(frameCount * 0.02 + h) * 20; translate(0, 0, (h - 7) * 5); box(w, monolithHeight, d); pop(); } fill(0, 0, 100, 0.05); noStroke(); box(180, monolithHeight, 180); drawEnergyCore(); pop(); } function drawEnergyCore() { push(); stroke(190, 80, 100, 0.8); strokeWeight(2); beginShape(LINES); for (let i = 0; i < 50; i++) { let y = map(i, 0, 50, -monolithHeight / 2, monolithHeight / 2); let nx = (noise(i, frameCount * 0.1) - 0.5) * 150 * (shakeAmt * 0.5); let nz = (noise(i + 50, frameCount * 0.1) - 0.5) * 150 * (shakeAmt * 0.5); vertex(nx, y, nz); vertex(0, y + 20, 0); } endShape(); pop(); } function drawStars() { noStroke(); for (let p of particles) { push(); translate(p.x, p.y, p.z); fill(200, 20, 100, 0.5); sphere(p.size); pop(); p.y += p.speed; if (p.y > height * 2) p.y = -height * 2; } } function windowResized() { resizeCanvas(windowWidth, windowHeight); monolithHeight = height * 1.5; }
  </script>
</body>

</html>
