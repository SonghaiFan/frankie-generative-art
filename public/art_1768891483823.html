  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>碎镜构像主义 (Fragmented Specularism)</h1>
    <p>这种艺术风格名为‘碎镜构像主义’，它源于你对‘自我倒影’的哲学认知，将现实中的‘现成品’——你的实时影像，通过‘立体主义’的棱镜进行暴力而诗意的拆解。它打破了单一的视觉逻辑，用交错的几何色块重塑感知的边界。画面呈现出如破碎镜面般的质感，每一个旋转的碎片都是对‘自我’的一种多维观察。色调介于工业冷的灰阶与光谱色散之间，象征着理性分析与感性爆发的交织。请点击屏幕以激活摄像头（Sensor Activation），进入这场关于存在与重构的视觉实验。</p>
  </div>
  <script>
    let capture;let pieces = [];let cols = 10;let rows = 8;let w, h;let isStarted = false;function setup() {createCanvas(windowWidth, windowHeight);capture = createCapture(VIDEO);capture.size(640, 480);capture.hide();w = width / cols;h = height / rows;for (let i = 0; i < cols; i++) {for (let j = 0; j < rows; j++) {pieces.push({x: i * w,y: j * h,targetX: i * w,targetY: j * h,angle: 0,rotSpeed: random(-0.02, 0.02),offset: random(100)});}}strokeJoin(ROUND);}function draw() {background(20, 20, 25);if (!isStarted) {fill(255);textAlign(CENTER, CENTER);textSize(24);text("CLICK TO REFLECT / 点击以映射自我", width / 2, height / 2);return;}let vidW = capture.width;let vidH = capture.height;let stepX = vidW / cols;let stepY = vidH / rows;for (let i = 0; i < pieces.length; i++) {let p = pieces[i];let mouseDist = dist(mouseX, mouseY, p.x + w / 2, p.y + h / 2);let spread = map(mouseDist, 0, 500, 50, 0);let noiseVal = noise(p.offset + frameCount * 0.01);p.angle += p.rotSpeed * (1 + spread * 0.1);push();translate(p.x + w / 2, p.y + h / 2);rotate(p.angle + noiseVal * 0.2);shearX(sin(frameCount * 0.02 + p.offset) * 0.1);let sx = (i % cols) * stepX;let sy = floor(i / cols) * stepY;let displayW = w * (1 + spread * 0.01);let displayH = h * (1 + spread * 0.01);drawingContext.shadowBlur = 15;drawingContext.shadowColor = color(0, 255, 255, 50);noStroke();fill(255);beginShape();texture(capture);image(capture, -displayW / 2, -displayH / 2, displayW, displayH, sx, sy, stepX, stepY);endShape();noFill();stroke(255, 255, 255, 100);rect(-displayW / 2, -displayH / 2, displayW, displayH);stroke(255, 0, 150, 150);line(-displayW / 2, -displayH / 2, displayW / 2, displayH / 2);pop();}drawOverlay();}function mousePressed() {isStarted = true;if (getAudioContext().state !== 'running') {getAudioContext().resume();}}function windowResized() {resizeCanvas(windowWidth, windowHeight);w = width / cols;h = height / rows;for (let i = 0; i < pieces.length; i++) {pieces[i].x = (i % cols) * w;pieces[i].y = floor(i / cols) * h;}}function drawOverlay() {noFill();stroke(255, 20);for(let i=0; i<width; i+=100){line(i, 0, i, height);}for(let j=0; j<height; j+=100){line(0, j, width, j);}fill(255, 200);noStroke();textSize(12);textAlign(LEFT);text("SPECULAR_DECONSTRUCTION_MODE: ACTIVE", 20, 30);text("CUBIST_FRAME_RATE: " + floor(frameRate()), 20, 50);text("OBJECT_READY_MADE: USER_REFLECTION", 20, 70);}
  </script>
