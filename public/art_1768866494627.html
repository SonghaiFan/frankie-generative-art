<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>浮岚光力学 (Ephemeral Ether-Kinematics) - Art Archive Oracle</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>浮岚光力学 (Ephemeral Ether-Kinematics)</h1>
    <p>
      这种风格是浮世绘的流动线条、光与空间艺术的无形场域以及动态艺术的物理律动的终极融合。视觉语言上，它摒弃了固定的形状，转而使用极具感官冲击力的“光脉冲线条”来模拟浮世绘中的浪潮与云气。色彩从深邃的虚空黑渐变至极高饱和度的电光色，强调‘感知强度’。每一条曲线都依据算法模拟的流体动力学进行实时演化，呈现出一种介于物质与非物质、永恒与瞬时之间的视觉奇观，让观者在沉浸式的光影交织中感受感知边界的震颤。
    </p>
  </div>
  <script>
    let particles = []; let numParticles = 80; let colorPalette = []; function setup() { createCanvas(windowWidth, windowHeight); colorMode(HSB, 360, 100, 100, 100); for (let i = 0; i < numParticles; i++) { particles.push(new WaveStrand(i * (height / numParticles))); } colorPalette = [color(190, 80, 100), color(280, 80, 100), color(340, 80, 100), color(20, 80, 100)]; background(0); } function draw() { background(0, 0, 0, 15); for (let p of particles) { p.update(); p.display(); } } function windowResized() { resizeCanvas(windowWidth, windowHeight); particles = []; for (let i = 0; i < numParticles; i++) { particles.push(new WaveStrand(i * (height / numParticles))); } } class WaveStrand { constructor(yOffset) { this.yOffset = yOffset; this.points = []; this.numPoints = 50; this.seed = random(1000); this.speed = random(0.005, 0.015); this.hue = random(180, 360); } update() { this.points = []; for (let i = 0; i <= this.numPoints; i++) { let x = map(i, 0, this.numPoints, 0, width); let noiseVal = noise(i * 0.1, frameCount * this.speed, this.seed); let y = this.yOffset + map(noiseVal, 0, 1, -150, 150); let mouseDist = dist(mouseX, mouseY, x, y); let influence = map(min(mouseDist, 300), 0, 300, 1.5, 1); y += (mouseY - y) * (1 - influence) * 0.5; this.points.push({ x: x, y: y }); } } display() { noFill(); let intensity = map(sin(frameCount * 0.05 + this.seed), -1, 1, 1, 4); strokeWeight(intensity); let currentHue = (this.hue + frameCount * 0.2) % 360; stroke(currentHue, 80, 100, 60); beginShape(); for (let p of this.points) { curveVertex(p.x, p.y); } endShape(); if (random(1) > 0.98) { this.glow(intensity); } } glow(size) { let p = this.points[floor(random(this.points.length))]; for (let r = size * 10; r > 0; r -= 2) { fill(this.hue, 80, 100, map(r, 0, size * 10, 20, 0)); noStroke(); ellipse(p.x, p.y, r, r); } } }
  </script>
</body>

</html>
