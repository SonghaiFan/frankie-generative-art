<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>超验视幻流 (Transcendental Illusory Flux) - Art Archive Oracle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>超验视幻流 (Transcendental Illusory Flux)</h1>
    <p>
      这种风格将‘崇高’的深邃空间感与‘欧普艺术’的几何理智相结合，通过‘自动主义’的随机路径打破绝对秩序。它利用黑白的强烈对比与细微的色彩偏移，在屏幕上构建出一种不断扩张又自我消解的视觉迷宫。流动的线条如同潜意识的脉动，穿梭在理性的格栅之间，创造出一种‘错觉’：画面既是静止的数学模型，又是无限延展的精神深渊。观众在注视中会感受到感知的动摇，从而触及超越日常视觉的心理真实。
    </p>
  </div>
  <script>
    let particles = [];
    let numParticles = 80;
    let t = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(0);
      for (let i = 0; i < numParticles; i++) {
        particles.push(new AutomatismStroke());
      }
    }

    function draw() {
      // Sublime Background: Fading and depth
      fill(0, 25);
      rect(0, 0, width, height);

      // Op Art Grid Layer: Visual Rationality
      drawOpGrid();

      // Automatism Layer: Subconscious release
      for (let p of particles) {
        p.update();
        p.display();
      }

      t += 0.005;
    }

    function drawOpGrid() {
      push();
      noFill();
      strokeWeight(0.5);
      let spacing = 40;
      let distortion = map(sin(t), -1, 1, 5, 50);

      for (let x = 0; x <= width; x += spacing) {
        let alpha = map(dist(x, 0, mouseX, 0), 0, width / 2, 255, 20);
        stroke(255, alpha);
        beginShape();
        for (let y = 0; y <= height; y += 20) {
          let nx = x + sin(y * 0.01 + t) * distortion * (mouseX / width);
          vertex(nx, y);
        }
        endShape();
      }

      for (let y = 0; y <= height; y += spacing) {
        let alpha = map(dist(0, y, 0, mouseY), 0, height / 2, 255, 20);
        stroke(255, alpha);
        beginShape();
        for (let x = 0; x <= width; x += 20) {
          let ny = y + cos(x * 0.01 + t) * distortion * (mouseY / height);
          vertex(x, ny);
        }
        endShape();
      }
      pop();
    }

    class AutomatismStroke {
      constructor() {
        this.reset();
      }

      reset() {
        this.pos = createVector(random(width), random(height));
        this.vel = createVector(0, 0);
        this.acc = createVector(0, 0);
        this.prevPos = this.pos.copy();
        this.maxSpeed = random(1, 3);
        this.hue = random([200, 255]); // Subtle cold accents
        this.life = random(100, 255);
      }

      update() {
        let angle = noise(this.pos.x * 0.005, this.pos.y * 0.005, t) * TWO_PI * 2;
        this.acc = p5.Vector.fromAngle(angle);
        this.vel.add(this.acc);
        this.vel.limit(this.maxSpeed);
        this.prevPos = this.pos.copy();
        this.pos.add(this.vel);
        this.life -= 0.5;

        if (this.life < 0 || this.pos.x < 0 || this.pos.x > width || this.pos.y < 0 || this.pos.y > height) {
          this.reset();
        }
      }

      display() {
        strokeWeight(1.5);
        stroke(this.hue, this.life);
        line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0);
    }
  </script>
</body>

</html>
