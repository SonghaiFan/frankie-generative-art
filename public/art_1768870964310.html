  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>

<body>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>剧场式逻辑山水 (Theatrical Logical Shanshui)</h1>
    <p>
      这种风格是将中国传统山水的意境置于工业构成的骨架之上。它利用构成主义的直线与几何切面重塑山峦的脊梁，通过‘光与空间’运动的漫反射光效赋予其灵魂。‘坎普’的戏谑色彩被引入，将严肃的自然景观转化为一种高度人工化的、戏剧性的舞台布景。画面中，严谨的几何网格与流动的荧光渐变共存，呈现出一种冷静的秩序感，却又在光影的律动中消解了现实的沉重，体现了理性秩序与感性虚幻之间的完美平衡。
    </p>
  </div>
  <script>
    let cols, rows; let scl = 40; let w, h; let terrain = []; let shift = 0; function setup() { createCanvas(windowWidth, windowHeight, WEBGL); w = width * 2; h = height * 1.5; cols = w / scl; rows = h / scl; for (let x = 0; x < cols; x++) { terrain[x] = []; for (let y = 0; y < rows; y++) { terrain[x][y] = 0; } } } function draw() { background(5, 5, 15); let locX = mouseX - width / 2; let locY = mouseY - height / 2; pointLight(255, 0, 150, locX, locY, 200); pointLight(0, 255, 255, -locX, -locY, 200); ambientLight(20); shift -= 0.02; let yoff = shift; for (let y = 0; y < rows; y++) { let xoff = 0; for (let x = 0; x < cols; x++) { terrain[x][y] = map(noise(xoff, yoff), 0, 1, -150, 150); xoff += 0.15; } yoff += 0.15; } push(); rotateX(PI / 3); translate(-w / 2, -h / 2 + 100); stroke(255, 30); noFill(); for (let y = 0; y < rows - 1; y++) { beginShape(TRIANGLE_STRIP); for (let x = 0; x < cols; x++) { let bright = map(terrain[x][y], -150, 150, 0, 255); let r = map(sin(shift + x * 0.1), -1, 1, 100, 255); let g = map(terrain[x][y], -150, 150, 50, 200); let b = 255; if (terrain[x][y] > 100) { fill(r, g, b, 150); stroke(255, 200); } else { noFill(); stroke(r, g, b, 80); } vertex(x * scl, y * scl, terrain[x][y]); vertex(x * scl, (y + 1) * scl, terrain[x][y + 1]); } endShape(); } pop(); push(); translate(locX * 0.5, locY * 0.5, -500); noStroke(); drawingContext.shadowBlur = 100; drawingContext.shadowColor = color(255, 0, 150); fill(255, 0, 150, 200); ellipse(0, 0, 200, 200); pop(); push(); noFill(); stroke(0, 255, 255, 50); for (let i = 0; i < 5; i++) { ellipse(0, 0, 1000 + i * 100, 1000 + i * 100); } pop(); } function windowResized() { resizeCanvas(windowWidth, windowHeight); w = width * 2; h = height * 1.5; cols = w / scl; rows = h / scl; }
  </script>
</body>
