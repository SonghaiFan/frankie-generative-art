<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>青花爆裂主义 (Cyan-Porcelain Explosivism) - Art Archive Oracle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;

    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;

      color: white;
      mix-blend-mode: difference;

    h1 {

      font-size: 1rem;

<body>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>青花爆裂主义 (Cyan-Porcelain Explosivism)</h1>
    <p>
      青花爆裂主义是一种将永恒的静谧与瞬间的毁灭相融合的艺术形式。它捕捉了青花瓷在‘爆炸’瞬间的动态美学：深邃的钴蓝色纹饰在纯净的釉白底色上碎裂、飞溅，却在混沌中保持着一种近乎神圣的秩序感。这种风格反映了你内心对‘破后而立’的渴望——在传统的宁静归宿中，通过爆发性的能量重组自我认知的碎片。画面中，如书法般流畅的蓝色线条与锐利的几何碎片交织，象征着情感在极简约束下的激烈释放。请点击或拖动屏幕，在深邃的虚空中触发瓷器的重生与绽放。
    </p>
  </div>
  <script>
    let fragments = []; let corePulse = 0; function setup() { createCanvas(windowWidth, windowHeight, WEBGL); colorMode(HSB, 360, 100, 100, 1); noStroke(); } function draw() { background(230, 80, 5); ambientLight(60); pointLight(0, 0, 100, 0, 0, 200); rotateX(frameCount * 0.002); rotateY(frameCount * 0.003); corePulse = sin(frameCount * 0.05) * 20; fill(210, 10, 95); sphere(30 + corePulse); if (mouseIsPressed) { for (let i = 0; i < 3; i++) { fragments.push(new Fragment(mouseX - width / 2, mouseY - height / 2)); } } for (let i = fragments.length - 1; i >= 0; i--) { fragments[i].update(); fragments[i].display(); if (fragments[i].isDead()) { fragments.splice(i, 1); } } } class Fragment { constructor(x, y) { this.pos = createVector(x, y, random(-100, 100)); this.vel = p5.Vector.random3D().mult(random(2, 10)); this.rot = createVector(random(PI), random(PI), random(PI)); this.rotVel = createVector(random(-0.05, 0.05), random(-0.05, 0.05), random(-0.05, 0.05)); this.life = 1.0; this.decay = random(0.005, 0.015); this.type = random() > 0.4 ? 'blue' : 'white'; this.size = random(5, 25); this.noiseOffset = random(1000); } update() { this.pos.add(this.vel); this.rot.add(this.rotVel); this.vel.mult(0.98); let n = noise(this.pos.x * 0.01, this.pos.y * 0.01, frameCount * 0.01); this.pos.add(createVector(cos(n * TWO_PI), sin(n * TWO_PI), 0).mult(1)); this.life -= this.decay; } display() { push(); translate(this.pos.x, this.pos.y, this.pos.z); rotateX(this.rot.x); rotateY(this.rot.y); rotateZ(this.rot.z); if (this.type === 'blue') { fill(225, 90, random(60, 90), this.life); } else { fill(200, 5, 100, this.life); } beginShape(); for (let i = 0; i < 3; i++) { let angle = TWO_PI / 3 * i; let r = this.size * (1 + sin(this.noiseOffset + frameCount * 0.1) * 0.2); vertex(cos(angle) * r, sin(angle) * r, 0); } endShape(CLOSE); if (this.type === 'blue' && this.life > 0.5) { noFill(); stroke(225, 80, 100, this.life * 0.5); strokeWeight(1); ellipse(0, 0, this.size * 1.5, this.size * 1.5); } pop(); } isDead() { return this.life <= 0; } } function mousePressed() { for (let i = 0; i < 50; i++) { fragments.push(new Fragment(mouseX - width / 2, mouseY - height / 2)); } } function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
