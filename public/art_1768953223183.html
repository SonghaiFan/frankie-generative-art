<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Binary Visceralism (二进制脏器派) - Art Archive Oracle</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">美学签名</div>
    <h1>Binary Visceralism (二进制脏器派)</h1>
    <p>二进制脏器派（Binary
      Visceralism）是数字逻辑与新表现主义情感的视觉碰撞。它在严丝合缝的字符矩阵（代表秩序与冷峻的现代技术）之上，覆盖了由音频驱动的、具有侵略性的原始笔触（代表本能与生命力）。画面的底层是不断流转的十六进制代码网格，而表层则通过实时捕捉环境音量，生成如伤痕或喷溅般的粗糙纹理。色彩上严格限制在灰阶与极具冲击力的警示色之间，象征着个体在数字化结构中试图通过破坏性的表达来重塑存在感的心理补偿。
    </p>
  </div>
  <script>
    let mic, fft; let started = false; let chars = '0123456789ABCDEF'; let gridSize = 20; function setup() { createCanvas(windowWidth, windowHeight); colorMode(HSB, 360, 100, 100, 1); textAlign(CENTER, CENTER); textSize(gridSize); mic = new p5.AudioIn(); fft = new p5.FFT(); } function draw() { background(0, 0, 5, 0.15); if (!started) { fill(0, 0, 100); text('CLICK TO ACTIVATE BINARY VISCERALISM', width / 2, height / 2); return; } let vol = mic.getLevel(); let spectrum = fft.analyze(); let energy = fft.getEnergy('bass'); drawMatrix(vol); drawVisceralStrokes(vol, energy); } function drawMatrix(vol) { fill(0, 0, 20, 0.5); for (let x = 0; x < width; x += gridSize) { for (let y = 0; y < height; y += gridSize) { if (random() < 0.01 + vol) { let char = chars.charAt(floor(random(chars.length))); text(char, x + gridSize / 2, y + gridSize / 2); } } } } function drawVisceralStrokes(vol, energy) { push(); translate(width / 2, height / 2); noFill(); strokeWeight(map(vol, 0, 0.5, 1, 10)); let hue = map(energy, 0, 255, 0, 60); if (hue > 30) hue = 0; stroke(hue, 90, 80, 0.6); beginShape(); for (let i = 0; i < 100; i++) { let angle = map(i, 0, 100, 0, TWO_PI); let r = map(noise(i * 0.1, frameCount * 0.02), 0, 1, 50, 200 + vol * 1000); let x = r * cos(angle); let y = r * sin(angle); vertex(x, y); if (random() < 0.05 * vol) { line(x, y, x + random(-50, 50), y + random(-50, 50)); } } endShape(CLOSE); pop(); if (vol > 0.2) { stroke(0, 100, 100, 0.8); strokeWeight(random(1, 5)); for (let i = 0; i < 5; i++) { line(random(width), 0, random(width), height); } } } function mousePressed() { userStartAudio(); mic.start(); fft.setInput(mic); started = true; } function windowResized() { createCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
