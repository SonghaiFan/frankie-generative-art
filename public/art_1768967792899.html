<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>新偶像回响主义 (Neo-Iconic Echoism) - Art Archive Oracle</title>
  <script>
    // CRITICAL: Patch to prevent 'unload' violation BEFORE any libraries load
    const originalAddEventListener = window.addEventListener;
    window.addEventListener = function (type, listener, options) {
      if (type === 'unload' || type === 'beforeunload') return;
      return originalAddEventListener.call(this, type, listener, options);
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">美学签名</div>
    <h1>新偶像回响主义 (Neo-Iconic Echoism)</h1>
    <p>
      该艺术风格将“挪用”作为核心策略，通过网格化的机械重复与高饱和度的波普色调，消解个体的唯一性。视觉语言结合了极简的点阵拓扑与碎片化的文字排版，将用户的实时生物特征转化为可消费的视觉符号。这种“复印式”的拼贴逻辑反映了在符号海洋中重构个人身份的尝试：当自我被无限次复制与重组，原本的“原创性”让位于一种动态的、群体性的数字叙事。
    </p>
  </div>
  <script>
    // Ensure p5.js sound works with user gesture
    if (typeof window.userStartAudio === 'undefined') {
      window.userStartAudio = function () {
        if (window.getAudioContext && window.getAudioContext().resume) {
          return window.getAudioContext().resume();
        }
        return Promise.resolve();
      };
    }

    let faceMesh; let video; let predictions = []; let cols = 3; let rows = 2; let words = ['IDOL', 'REPLICA', 'ECHO', 'VOID'];
    function setup() {
      createCanvas(windowWidth, windowHeight); colorMode(HSB, 360, 100, 100, 1);
      video = createCapture(VIDEO); video.size(320, 240); video.hide();
      faceMesh = ml5.faceMesh(video, { maxFaces: 1, flipped: true }, () => { faceMesh.detectStart(video, gotFaces); });
    }
    function gotFaces(results) { predictions = results; }
    function draw() {
      background(0); let w = width / cols; let h = height / rows;
      video.loadPixels();
      if (video.pixels.length > 0) {
        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            push(); translate(i * w, j * h); drawWarholCell(i, j, w, h); pop();
          }
        }
      }
      drawTypography();
    }
    function drawWarholCell(col, row, w, h) {
      let idx = col + row * cols;
      const palettes = [
        [color(60, 80, 100), color(330, 90, 100), color(240, 100, 40)], [color(190, 80, 100), color(60, 90, 100), color(350, 90, 60)],
        [color(220, 70, 100), color(350, 80, 100), color(260, 100, 30)], [color(280, 60, 100), color(170, 90, 100), color(220, 90, 40)],
        [color(10, 80, 100), color(200, 90, 100), color(0, 0, 0)], [color(80, 70, 100), color(30, 90, 100), color(10, 100, 20)]
      ];
      let p = palettes[idx % palettes.length];

      // Calculate Crop (Cover logic)
      let cellAspect = w / h;
      let videoAspect = video.width / video.height;
      let sw, sh, sx, sy;
      if (videoAspect > cellAspect) {
        sh = video.height; sw = sh * cellAspect;
        sx = (video.width - sw) / 2; sy = 0;
      } else {
        sw = video.width; sh = sw / cellAspect;
        sx = 0; sy = (video.height - sh) / 2;
      }

      noStroke();
      let stepSize = 4;
      for (let y = 0; y < sh; y += stepSize) {
        for (let x = 0; x < sw; x += stepSize) {
          // Mirror the rendered pixels to match mirrored webcam experience
          let vx = floor(sx + (sw - x - 1));
          let vy = floor(sy + y);
          let pIdx = (vx + vy * video.width) * 4;
          let br = (video.pixels[pIdx] + video.pixels[pIdx + 1] + video.pixels[pIdx + 2]) / 3;
          fill(br > 165 ? p[0] : (br > 85 ? p[1] : p[2]));
          rect(map(x, 0, sw, 0, w), map(y, 0, sh, 0, h), w / (sw / stepSize) + 1, h / (sh / stepSize) + 1);
        }
      }

      // Halftone overlay
      fill(0, 0, 0, 0.1);
      for (let ix = 0; ix < w; ix += 12) {
        for (let iy = 0; iy < h; iy += 12) {
          ellipse(ix, iy, 2, 2);
        }
      }

      // Biometric Symbolization
      if (predictions.length > 0) {
        let face = predictions[0];
        let nose = face.keypoints[1];

        // msx: The start of the crop in the mirrored camera space (320 - right edge)
        let msx = video.width - (sx + sw);
        let cx = map(nose.x - msx, 0, sw, 0, w);
        let cy = map(nose.y - sy, 0, sh, 0, h);

        if (cx > 0 && cx < w && cy > 0 && cy < h) {
          // Crosshair on nose
          stroke(p[0]); strokeWeight(1); noFill();
          line(cx - 15, cy, cx + 15, cy);
          line(cx, cy - 15, cx, cy + 15);

          // ID Label on forehead/nose area
          fill(p[2]); noStroke(); rect(cx - 30, cy + 20, 60, 12);
          fill(p[0]); textAlign(CENTER, CENTER); textSize(7);
          text(`REPLICA_${1000 + idx}`, cx, cy + 26);

          // Mouth Tag: Black background, White text "@xxx"
          if (face.keypoints[13]) {
            let mouth = face.keypoints[13];
            let mx = map(mouth.x - msx, 0, sw, 0, w);
            let my = map(mouth.y - sy, 0, sh, 0, h);

            push();
            rectMode(CENTER);
            fill(0); // Black background
            noStroke();
            let label = "@REPLICA";
            let tw = textWidth(label) + 8;
            rect(mx, my, tw, 16);

            fill(255); // White text
            textAlign(CENTER, CENTER);
            textSize(10);
            text(label, mx, my);
            pop();
          }
        }
      }

      // Final cell effects
      let scanY = (frameCount * 5 + idx * 30) % h;
      stroke(p[0], 0.3); strokeWeight(1); line(0, scanY, w, scanY);
      stroke(p[2]); strokeWeight(8); noFill(); rect(0, 0, w, h);
    }

    function drawTypography() {
      const concepts = ['APPROPRIATION', 'MECHANICAL REPRODUCTION', 'DISSOLVE ID', 'CONSUMABLE SYMBOL', 'COLLECTIVE NARRATIVE'];
      randomSeed(floor(frameCount / 30));
      for (let k = 0; k < 4; k++) {
        let snippet = concepts[floor(random(concepts.length))];
        let tx = random(width * 0.1, width * 0.7);
        let ty = random(height * 0.1, height * 0.9);
        fill(0, 0, 100, 0.6); noStroke();
        rect(tx - 5, ty - 18, textWidth(snippet) + 10, 24);
        fill(0); textSize(16); textAlign(LEFT);
        text(snippet, tx, ty);
      }
      randomSeed();
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
