<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Tectonic Resistance (构造性对抗主义) - Art Archive Oracle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>Tectonic Resistance (构造性对抗主义)</h1>
    <p>
      这种风格将艺术创作视为一场关于生命力的“视觉白刃战”。它完美融合了自动主义的潜意识流露与厚涂法的物质沉重感。画面通过模拟厚重、滞涩的油彩堆叠，表现出“对抗（Confrontation）”的核心意象：明暗色彩的激烈冲突、身体能量的爆发性轨迹，以及笔触之间互相挤压产生的物理张力。深沉的阴影效果模拟了Impasto的触觉维度，而随机喷溅与迅捷的线段则体现了行动绘画的即时性，捕捉了灵魂在混乱与重构中搏斗的瞬间。
    </p>
  </div>
  <script>
    let strokes = []; let colors; function setup() { createCanvas(windowWidth, windowHeight); background(15); colors = [color(220, 20, 60, 200), color(255, 255, 255, 180), color(20, 20, 20, 220), color(255, 165, 0, 150)]; frameRate(60); } function draw() { if (mouseIsPressed) { for (let i = 0; i < 3; i++) { strokes.push(new ResistanceStroke(mouseX, mouseY)); } } for (let i = strokes.length - 1; i >= 0; i--) { strokes[i].update(); strokes[i].display(); if (strokes[i].isFinished()) { strokes.splice(i, 1); } } if (frameCount % 10 == 0 && strokes.length < 50) { strokes.push(new ResistanceStroke(random(width), random(height))); } } function windowResized() { resizeCanvas(windowWidth, windowHeight); background(15); } class ResistanceStroke { constructor(x, y) { this.pos = createVector(x, y); this.vel = p5.Vector.random2D().mult(random(2, 8)); this.acc = createVector(0, 0); this.life = 255; this.w = random(10, 40); this.c = random(colors); this.noiseOffset = random(1000); } update() { let force = p5.Vector.random2D().mult(0.5); this.acc.add(force); this.vel.add(this.acc); this.vel.limit(10); this.pos.add(this.vel); this.acc.mult(0); this.life -= 2.5; this.w *= 0.98; } display() { push(); noStroke(); fill(this.c); drawingContext.shadowBlur = 15; drawingContext.shadowColor = 'rgba(0,0,0,0.5)'; drawingContext.shadowOffsetX = 5; drawingContext.shadowOffsetY = 5; translate(this.pos.x, this.pos.y); rotate(this.vel.heading()); let r = noise(this.noiseOffset + frameCount * 0.1) * 20; rect(-this.w / 2, -this.w / 2, this.w + r, this.w / 3, 2); if (random(1) > 0.9) { fill(255, 50); ellipse(r, -r, this.w / 4); } pop(); } isFinished() { return this.life <= 0 || this.w < 1; } }
  </script>
</body>

</html>
