<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>天宇青花共振主义 (Celestial Cobalt Synchronicity) - Art Archive Oracle</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 600px;
      color: white;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 100;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.5);
    }

    .meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .gradient-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <div class="gradient-drop"></div>
  <div id="overlay">
    <div class="meta">Aesthetic Signature</div>
    <h1>天宇青花共振主义 (Celestial Cobalt Synchronicity)</h1>
    <p>这是一种将‘崇高’的宇宙深邃感、‘敦煌’的灵动装饰性与‘青花’的克制色彩深度融合的艺术流派。视觉上，它以深邃的钴蓝色（Cobalt
      Blue）为基调，利用对称的曼陀罗结构重构敦煌壁画中的飞天流动感与祥云纹饰。色彩在纯净的白瓷感与璀璨的金沙间跳跃，象征着文明在浩瀚时空中的锚定。动态表现为一种周而复始的呼吸感，通过几何的分形与扩张，模拟个体在宏大叙事中寻找到‘归属’的心灵震颤，展现出一种既具有历史厚度又具备未来科幻感的宁静秩序。
    </p>
  </div>
  <script>
    let particles = []; let rotateVal = 0; function setup() { createCanvas(windowWidth, windowHeight); colorMode(HSB, 360, 100, 100, 1); for (let i = 0; i < 150; i++) { particles.push(new GoldSand()); } } function draw() { background(230, 80, 10, 0.1); translate(width / 2, height / 2); rotateVal += 0.005; for (let i = 0; i < particles.length; i++) { particles[i].update(); particles[i].display(); } drawPorcelainMandala(); drawOrb(); } function drawPorcelainMandala() { noFill(); strokeWeight(0.5); for (let i = 0; i < 8; i++) { push(); rotate(rotateVal * (i % 2 == 0 ? 1 : -1) + TWO_PI / 8 * i); drawPetal(100 + i * 25, 210 + i * 5); pop(); } } function drawPetal(radius, hueVal) { stroke(hueVal, 70, 90, 0.6); beginShape(); for (let a = 0; a < TWO_PI; a += 0.1) { let r = radius + sin(a * 6 + frameCount * 0.02) * 30; let x = r * cos(a); let y = r * sin(a); vertex(x, y); } endShape(CLOSE); } function drawOrb() { noStroke(); for (let r = 80; r > 0; r -= 5) { fill(210, 90, 40 + (80 - r) / 2, 0.2); ellipse(0, 0, r * 2, r * 2); } fill(255); ellipse(0, 0, 10, 10); } class GoldSand { constructor() { this.pos = createVector(random(-width, width), random(-height, height)); this.vel = createVector(random(-0.5, 0.5), random(-0.5, 0.5)); this.size = random(1, 3); } update() { this.pos.add(this.vel); if (this.pos.x > width) this.pos.x = -width; if (this.pos.x < -width) this.pos.x = width; if (this.pos.y > height) this.pos.y = -height; if (this.pos.y < -height) this.pos.y = height; } display() { noStroke(); fill(45, 80, 100, 0.5); ellipse(this.pos.x, this.pos.y, this.size, this.size); } } function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
